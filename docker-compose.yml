services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smartdoor
      POSTGRES_USER: smartdoor
      POSTGRES_PASSWORD: smartdoor
    ports:
      - "5432:5432"